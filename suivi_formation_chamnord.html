<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Formation — Crew Academy</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f2ec;color:#1b2430;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}</style>
</head>
<body>
<p id="crew-msg">Chargement…</p>
<script>
/* Page d'entrée Crew Academy : le code commun est chargé depuis un seul endroit.
   Seuls ces deux réglages sont propres à cette franchise. */
(function () {
  var CONFIG = {
    label: 'Chamnord',
    scriptUrl: 'https://script.google.com/macros/s/AKfycbz0Dg-wg4Y4XFo7g11AH7CljEQX4XHtNu4rV8O2mvvMawOXw7-tDVV6p_EhVhmRAfdnqA/exec'
  };
  var CORE_URL = 'https://matthieujacobmcd-beep.github.io/crew-academy-core/core.html';
  var CACHE_KEY = 'crew_core_cache_v1';

  function lancer(html) {
    html = html.split('__FRANCHISE_LABEL__').join(CONFIG.label)
               .split('__APPS_SCRIPT_URL__').join(CONFIG.scriptUrl);
    document.open();
    document.write(html);
    document.close();
  }
  function lireCache() { try { return localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }
  function ecrireCache(t) { try { localStorage.setItem(CACHE_KEY, t); } catch (e) {} }
  function erreur() {
    var m = document.getElementById('crew-msg');
    if (m) m.textContent = 'Impossible de charger Crew Academy. Vérifie ta connexion puis recharge la page.';
  }

  fetch(CORE_URL, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (t) {
      if (t.indexOf('__APPS_SCRIPT_URL__') === -1) throw new Error('core invalide');
      ecrireCache(t);
      lancer(t);
    })
    .catch(function () {
      var c = lireCache();
      if (c) lancer(c); else erreur();
    });
})();
</script>
</body>
</html>
